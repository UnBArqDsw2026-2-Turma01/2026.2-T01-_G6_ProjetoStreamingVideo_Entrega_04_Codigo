name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test and architecture
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            scripts/arquitetura/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install architecture dependencies
        run: npm ci --prefix scripts/arquitetura

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Architecture
        run: npm run verificar --prefix scripts/arquitetura

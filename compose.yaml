# Visão de Implantação executável (#20).
# Uso: docker compose up --build
# CA-01: http://localhost:3000
name: g6-streaming

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: g6-streaming:local
    ports:
      - "${PORT:-3000}:3000"
    # Credenciais de TESTE do Mercado Pago e do Stripe, se houver um .env na raiz.
    # Lidas só ao subir o contêiner: nunca entram na imagem (.dockerignore exclui o .env).
    # Sem o arquivo, a monetização usa apenas o gateway simulado.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      # Endereço que o navegador usa, para o retorno do checkout do Stripe.
      URL_PUBLICA: "http://localhost:${PORT:-3000}"
    restart: unless-stopped

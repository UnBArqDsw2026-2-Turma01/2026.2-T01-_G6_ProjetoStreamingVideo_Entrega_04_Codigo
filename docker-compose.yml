name: g6-streaming

services:
  # Ambiente persistente: código montado + node_modules da imagem.
  # Uso: docker compose up -d --build dev
  #      docker compose exec dev npm run demo
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: g6-streaming:local
    working_dir: /app
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      - g6_node_modules:/app/node_modules
    restart: unless-stopped

  # One-shot: roteiro CA-01 no terminal.
  # Uso: docker compose --profile demo run --rm demo
  demo:
    profiles: [demo]
    image: g6-streaming:local
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    volumes:
      - .:/app
      - g6_node_modules:/app/node_modules
    command: ["npm", "run", "demo"]

  # One-shot: página integrada (placeholder até a #16).
  # Uso: docker compose --profile web run --rm web
  web:
    profiles: [web]
    image: g6-streaming:local
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
    volumes:
      - .:/app
      - g6_node_modules:/app/node_modules
    command: ["npm", "run", "web"]

  # One-shot: typecheck + testes de todos os workspaces.
  # Uso: docker compose --profile check run --rm check
  check:
    profiles: [check]
    image: g6-streaming:local
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    volumes:
      - .:/app
      - g6_node_modules:/app/node_modules
    command: ["npm", "run", "check"]

volumes:
  g6_node_modules:
